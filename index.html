<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f5f7fb">
    <title>Rumbo a las estrellas · Quiz espacial</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --sky-hue: 248;
        --nebula-opacity: .10;
        --surface: #fff;
        --surface-soft: #f1f4fb;
        --ink: #17213a;
        --muted: #68738c;
        --line: #e4e9f2;
        --accent: #635bdb;
        --accent-dark: #4d45c3;
        --accent-soft: #eeedff;
        --green: #14845d;
        --green-soft: #e5f7ef;
        --red: #cc4354;
        --red-soft: #fff0f1;
        --panel-bg: #f7f8ff;
        --panel-grid: rgb(99 91 219 / 7%);
        --panel-border: #d9dcf4;
        --star-color: 99 91 219;
        --shadow: 0 24px 70px rgb(39 52 91 / 10%), 0 3px 12px rgb(39 52 91 / 5%);
      }

      @property --sky-hue {
        syntax: "<number>";
        inherits: true;
        initial-value: 248;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #101522;
          --nebula-opacity: .23;
          --surface: #191f30;
          --surface-soft: #222a3e;
          --ink: #f0f3ff;
          --muted: #a1abc3;
          --line: #303950;
          --accent: #a39cff;
          --accent-dark: #b6b0ff;
          --accent-soft: #302c50;
          --green: #62d7a9;
          --green-soft: #183a34;
          --red: #ff8290;
          --red-soft: #442a35;
          --panel-bg: #171d2d;
          --panel-grid: rgb(163 156 255 / 8%);
          --panel-border: #39415b;
          --star-color: 190 198 255;
          --shadow: 0 24px 70px rgb(0 0 0 / 26%), 0 3px 12px rgb(0 0 0 / 15%);
        }
      }

      * { box-sizing: border-box; }

      body {
        position: relative;
        min-height: 100vh;
        margin: 0;
        padding: 34px 20px;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::after {
        position: fixed;
        z-index: 0;
        inset: -18%;
        background:
          radial-gradient(ellipse at 26% 36%, hsl(var(--sky-hue) 75% 48% / var(--nebula-opacity)), transparent 35%),
          radial-gradient(ellipse at 76% 66%, hsl(calc(var(--sky-hue) + 68) 72% 45% / calc(var(--nebula-opacity) * .7)), transparent 38%),
          radial-gradient(ellipse at 70% 18%, hsl(calc(var(--sky-hue) - 55) 65% 42% / calc(var(--nebula-opacity) * .5)), transparent 30%);
        background-size: 130% 130%;
        content: "";
        pointer-events: none;
        transition: --sky-hue 1.4s ease;
        animation: nebula-drift 34s ease-in-out infinite alternate;
      }

      body::before {
        position: fixed;
        z-index: 0;
        inset: 0;
        background-image:
          radial-gradient(1px 1px at 8% 16%, rgb(var(--star-color) / 45%) 99%, transparent),
          radial-gradient(1px 1px at 21% 72%, rgb(var(--star-color) / 36%) 99%, transparent),
          radial-gradient(1.5px 1.5px at 34% 31%, rgb(var(--star-color) / 42%) 99%, transparent),
          radial-gradient(1px 1px at 47% 84%, rgb(var(--star-color) / 38%) 99%, transparent),
          radial-gradient(1px 1px at 62% 13%, rgb(var(--star-color) / 40%) 99%, transparent),
          radial-gradient(1.5px 1.5px at 76% 61%, rgb(var(--star-color) / 42%) 99%, transparent),
          radial-gradient(1px 1px at 91% 27%, rgb(var(--star-color) / 35%) 99%, transparent),
          radial-gradient(1px 1px at 86% 89%, rgb(var(--star-color) / 40%) 99%, transparent);
        content: "";
        opacity: .58;
        pointer-events: none;
        animation: star-twinkle 14s ease-in-out infinite alternate;
      }

      .app {
        position: relative;
        z-index: 1;
      }

      button { font: inherit; }

      .app { width: min(100%, 560px); }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-bottom: 20px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--accent);
        font-size: 16px;
        letter-spacing: 0;
        box-shadow: 0 3px 10px rgb(29 37 64 / 6%);
      }

      .card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .card-inner { padding: 30px 34px 34px; }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      .score {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      .score-icon { color: #e4a42c; }

      .progress-track {
        height: 8px;
        overflow: hidden;
        border-radius: 99px;
        background: var(--surface-soft);
      }

      .progress-fill {
        width: 10%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #7b72ef, #55bde6);
        transition: width 420ms cubic-bezier(.2,.75,.25,1);
      }

      .eyebrow {
        margin: 28px 0 7px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .1em;
        text-transform: uppercase;
      }

      .mission-panel {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        margin: 22px 0 21px;
        padding: 21px 22px 18px;
        border: 1px solid var(--panel-border);
        border-left: 3px solid var(--accent);
        border-radius: 15px;
        background-color: var(--panel-bg);
        background-image:
          linear-gradient(var(--panel-grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--panel-grid) 1px, transparent 1px),
          radial-gradient(ellipse at 100% 0%, var(--accent-soft), transparent 58%);
        background-size: 24px 24px, 24px 24px, auto;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 45%), 0 8px 20px rgb(31 42 78 / 5%);
      }

      .mission-panel::after {
        position: absolute;
        z-index: -1;
        top: 0;
        right: 0;
        width: 25px;
        height: 25px;
        border-top: 2px solid var(--accent);
        border-right: 2px solid var(--accent);
        content: "";
        opacity: .65;
      }

      .mission-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .mission-label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .13em;
        text-transform: uppercase;
      }

      .mission-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--green);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .1em;
        text-transform: uppercase;
      }

      .mission-status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 15%, transparent);
        content: "";
      }

      .mission-panel .eyebrow {
        margin: 18px 0 6px;
        font-size: 11px;
      }

      .mission-panel h1 {
        margin-bottom: 8px;
        font-size: clamp(22px, 4.8vw, 27px);
        line-height: 1.28;
      }

      .mission-panel h1:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
        outline-offset: 5px;
        border-radius: 3px;
      }

      .mission-panel .subtitle { margin-bottom: 0; }

      h1, h2, p { margin-top: 0; }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(22px, 5vw, 28px);
        line-height: 1.25;
        letter-spacing: -.035em;
      }

      .subtitle { margin-bottom: 23px; color: var(--muted); }

      .answers {
        display: grid;
        gap: 10px;
      }

      .answer {
        position: relative;
        display: flex;
        min-height: 54px;
        align-items: center;
        gap: 13px;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--surface);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
        transition: border-color 160ms ease, background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
      }

      .answer:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: var(--accent);
        box-shadow: 0 5px 14px rgb(90 82 208 / 10%);
      }

      .answer:focus-visible, .next-button:focus-visible, .restart-button:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
        outline-offset: 3px;
      }

      .answer:disabled { cursor: default; }

      .answer-key {
        display: grid;
        flex: 0 0 28px;
        width: 28px;
        height: 28px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .answer-text { flex: 1; }
      .answer-mark { display: none; font-size: 18px; font-weight: 800; }

      .answer.correct {
        border-color: var(--green);
        background: var(--green-soft);
        color: var(--green);
        animation: pop-in 350ms ease both;
      }

      .answer.correct .answer-key {
        border-color: transparent;
        background: color-mix(in srgb, var(--green) 16%, transparent);
        color: var(--green);
      }

      .answer.correct .answer-mark { display: block; }

      .answer.incorrect {
        border-color: var(--red);
        background: var(--red-soft);
        color: var(--red);
        animation: shake 420ms ease both;
      }

      .answer.incorrect .answer-key {
        border-color: transparent;
        background: color-mix(in srgb, var(--red) 15%, transparent);
        color: var(--red);
      }

      .answer.incorrect .answer-mark { display: block; }
      .answer.reveal { border-color: var(--green); }

      .feedback {
        min-height: 28px;
        margin: 15px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .feedback.good { color: var(--green); font-weight: 700; }
      .feedback.bad { color: var(--red); font-weight: 700; }

      .footer {
        display: flex;
        min-height: 50px;
        align-items: end;
        justify-content: flex-end;
        margin-top: 13px;
      }

      .next-button, .restart-button {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 0 19px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-weight: 750;
        cursor: pointer;
        transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
        box-shadow: 0 6px 16px rgb(99 91 219 / 24%);
      }

      .next-button:hover, .restart-button:hover {
        transform: translateY(-1px);
        background: var(--accent-dark);
      }

      [hidden] { display: none !important; }

      .result { padding: 46px 34px 38px; text-align: center; }

      .result-emoji {
        display: grid;
        width: 92px;
        height: 92px;
        place-items: center;
        margin: 0 auto 23px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--accent-soft);
        font-size: 52px;
        animation: float-in 600ms cubic-bezier(.2,.75,.25,1) both;
      }

      .result .eyebrow { margin: 0 0 8px; }
      .result h1 { margin-bottom: 9px; }
      .result-copy { max-width: 370px; margin: 0 auto 23px; color: var(--muted); }
      .final-score { margin-bottom: 25px; font-size: 18px; font-weight: 750; }
      .final-score strong { color: var(--accent); font-size: 28px; font-variant-numeric: tabular-nums; }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-7px); }
        40%, 80% { transform: translateX(7px); }
      }

      @keyframes pop-in {
        0% { transform: scale(.97); }
        65% { transform: scale(1.025); }
        100% { transform: scale(1); }
      }

      @keyframes float-in {
        from { opacity: 0; transform: translateY(12px) scale(.92); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes star-twinkle {
        from { opacity: .35; }
        to { opacity: .72; }
      }

      @keyframes nebula-drift {
        from { transform: translate3d(-1.2%, -1%, 0) scale(1); }
        to { transform: translate3d(1.2%, 1%, 0) scale(1.06); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .01ms !important;
        }

        body::before { animation: none; }
        body::after { animation: none; transition: none; }
      }

      @media (max-width: 480px) {
        body { padding: 22px 14px; }
        .card-inner { padding: 24px 20px 25px; }
        .mission-panel { padding: 18px 17px 16px; }
        .result { padding: 38px 20px 30px; }
        .brand { margin-bottom: 15px; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Rumbo a las estrellas</div>

      <section class="card" id="quiz" aria-labelledby="question">
        <div class="card-inner">
          <div class="topline">
            <span id="counter">Pregunta 1 de 10</span>
            <span class="score" aria-label="Puntuación actual"><span class="score-icon" aria-hidden="true">★</span><span id="score">0</span> puntos</span>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Progreso del cuestionario" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
            <div class="progress-fill" id="progress"></div>
          </div>
          <div class="mission-panel">
            <div class="mission-panel-head">
              <span class="mission-label">Objetivo de misión</span>
              <span class="mission-status" aria-hidden="true">En curso</span>
            </div>
            <p class="eyebrow" id="category">Nuestro vecindario</p>
            <h1 id="question" tabindex="-1"></h1>
            <p class="subtitle" id="prompt">Elige la respuesta correcta para continuar.</p>
          </div>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <div class="footer">
            <button class="next-button" id="next" type="button" hidden>Siguiente <span aria-hidden="true">→</span></button>
          </div>
        </div>
      </section>

      <section class="card result" id="result" aria-labelledby="result-title" hidden>
        <div class="result-emoji" id="result-emoji" aria-hidden="true"></div>
        <p class="eyebrow">Misión completada</p>
        <h1 id="result-title" tabindex="-1">¡Buen viaje, explorador!</h1>
        <p class="result-copy" id="result-copy"></p>
        <p class="final-score"><strong id="final-score">0</strong><span> / 10 respuestas correctas</span></p>
        <button class="restart-button" id="restart" type="button">Jugar de nuevo <span aria-hidden="true">↻</span></button>
      </section>
      <p class="sr-only" id="announcement" aria-live="polite"></p>
    </main>

    <script>
      const questions = [
        {
          category: "Nuestro vecindario",
          sky: 28,
          question: "¿Qué planeta es conocido como el planeta rojo?",
          answers: ["Venus", "Marte", "Júpiter", "Mercurio"],
          correct: 1,
          fact: "El óxido de hierro de su superficie le da ese característico tono rojizo."
        },
        {
          category: "La Luna",
          sky: 205,
          question: "¿Cómo se llamó la misión que llevó a los primeros humanos a la Luna?",
          answers: ["Apollo 11", "Gemini 8", "Vostok 1", "Artemis I"],
          correct: 0,
          fact: "Apollo 11 alunizó en julio de 1969; Neil Armstrong y Buzz Aldrin caminaron sobre la Luna."
        },
        {
          category: "Estrellas cercanas",
          sky: 46,
          question: "¿Cuál es la estrella más cercana a la Tierra?",
          answers: ["Próxima Centauri", "Sirio", "El Sol", "Betelgeuse"],
          correct: 2,
          fact: "El Sol está a unos 150 millones de kilómetros: nuestra estrella más próxima, con diferencia."
        },
        {
          category: "Gigantes gaseosos",
          sky: 18,
          question: "¿Qué planeta tiene la Gran Mancha Roja?",
          answers: ["Saturno", "Neptuno", "Urano", "Júpiter"],
          correct: 3,
          fact: "Es una enorme tormenta en Júpiter que lleva activa, al menos, varios siglos."
        },
        {
          category: "Exploración robótica",
          sky: 350,
          question: "¿Qué vehículo de la NASA explora Marte desde 2021?",
          answers: ["Curiosity", "Perseverance", "Opportunity", "Sojourner"],
          correct: 1,
          fact: "Perseverance busca señales de vida antigua y recogió muestras para traerlas a la Tierra."
        },
        {
          category: "Más allá de la Tierra",
          sky: 12,
          question: "¿En qué planeta se encuentra la montaña más alta del sistema solar?",
          answers: ["Marte", "Venus", "Tierra", "Mercurio"],
          correct: 0,
          fact: "El monte Olimpo de Marte se eleva unos 22 kilómetros sobre el terreno que lo rodea."
        },
        {
          category: "Años luz",
          sky: 218,
          question: "¿Qué mide un año luz?",
          answers: ["El tiempo que tarda una estrella en formarse", "La edad de una galaxia", "Una distancia", "La velocidad de la luz"],
          correct: 2,
          fact: "Es la distancia que recorre la luz en un año: cerca de 9,46 billones de kilómetros."
        },
        {
          category: "Estación espacial",
          sky: 180,
          question: "¿A qué altura aproximada orbita la Estación Espacial Internacional?",
          answers: ["40 km", "400 km", "4.000 km", "40.000 km"],
          correct: 1,
          fact: "La EEI viaja a unos 400 km de altura y completa una vuelta a la Tierra cada 90 minutos."
        },
        {
          category: "Huellas en la Luna",
          sky: 225,
          question: "¿Por qué las huellas de los astronautas pueden durar tanto en la Luna?",
          answers: ["La Luna tiene suelo de roca sólida", "El polvo lunar se convierte en hielo", "No hay viento ni lluvia que las borre", "La gravedad las fija al suelo"],
          correct: 2,
          fact: "Sin atmósfera, viento ni lluvia, las huellas pueden conservarse durante millones de años."
        },
        {
          category: "Un universo inmenso",
          sky: 275,
          question: "¿Cómo se llama nuestra galaxia?",
          answers: ["Andrómeda", "Vía Láctea", "Galaxia del Triángulo", "Sombrero"],
          correct: 1,
          fact: "La Vía Láctea contiene cientos de miles de millones de estrellas, incluido nuestro Sol."
        }
      ];

      const quiz = document.querySelector("#quiz");
      const result = document.querySelector("#result");
      const questionTitle = document.querySelector("#question");
      const answersEl = document.querySelector("#answers");
      const feedbackEl = document.querySelector("#feedback");
      const nextButton = document.querySelector("#next");
      const scoreEl = document.querySelector("#score");
      const counterEl = document.querySelector("#counter");
      const progressEl = document.querySelector("#progress");
      const progressTrack = document.querySelector(".progress-track");
      const announcement = document.querySelector("#announcement");
      let current = 0;
      let score = 0;
      let answered = false;

      function renderQuestion() {
        const item = questions[current];
        answered = false;
        document.documentElement.style.setProperty("--sky-hue", String(item.sky));
        counterEl.textContent = `Pregunta ${current + 1} de ${questions.length}`;
        document.querySelector("#category").textContent = item.category;
        questionTitle.textContent = item.question;
        feedbackEl.textContent = "";
        feedbackEl.className = "feedback";
        nextButton.hidden = true;
        nextButton.innerHTML = current === questions.length - 1
          ? 'Ver resultados <span aria-hidden="true">→</span>'
          : 'Siguiente <span aria-hidden="true">→</span>';
        progressEl.style.width = `${(current / questions.length) * 100}%`;
        progressTrack.setAttribute("aria-valuenow", String(current));
        answersEl.replaceChildren();

        item.answers.forEach((answer, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "answer";
          button.innerHTML = `<span class="answer-key" aria-hidden="true">${String.fromCharCode(65 + index)}</span><span class="answer-text"></span><span class="answer-mark" aria-hidden="true"></span>`;
          button.querySelector(".answer-text").textContent = answer;
          button.addEventListener("click", () => chooseAnswer(index));
          answersEl.append(button);
        });
      }

      function chooseAnswer(selected) {
        if (answered) return;
        answered = true;
        const item = questions[current];
        const buttons = [...answersEl.children];
        buttons.forEach(button => { button.disabled = true; });
        const isCorrect = selected === item.correct;
        const chosen = buttons[selected];
        const correct = buttons[item.correct];

        if (isCorrect) {
          score++;
          scoreEl.textContent = String(score);
          chosen.classList.add("correct");
          chosen.querySelector(".answer-mark").textContent = "✓";
          feedbackEl.textContent = `¡Correcto! ${item.fact}`;
          feedbackEl.classList.add("good");
        } else {
          chosen.classList.add("incorrect");
          chosen.querySelector(".answer-mark").textContent = "×";
          correct.classList.add("reveal");
          feedbackEl.textContent = `No exactamente. ${item.fact}`;
          feedbackEl.classList.add("bad");
        }

        announcement.textContent = `${isCorrect ? "Respuesta correcta." : `Respuesta incorrecta. La respuesta correcta es ${item.answers[item.correct]}.`} ${item.fact}`;
        nextButton.hidden = false;
      }

      function showResults() {
        quiz.hidden = true;
        result.hidden = false;
        document.querySelector("#final-score").textContent = String(score);
        const emoji = score === 10 ? "🚀" : score >= 7 ? "🌟" : score >= 4 ? "🪐" : "🌱";
        const title = score === 10 ? "¡Una misión perfecta!" : score >= 7 ? "¡Exploración estelar!" : score >= 4 ? "¡Vas por buen camino!" : "¡Toda misión empieza así!";
        const copy = score === 10
          ? "Has conquistado el cosmos. ¡Tu curiosidad no tiene límites!"
          : score >= 7
            ? "Tienes madera de astronauta. El universo ya no tiene tantos secretos para ti."
            : score >= 4
              ? "Cada respuesta te acerca a las estrellas. ¡Sigue explorando!"
              : "El espacio es enorme y siempre hay algo nuevo que aprender. ¡Inténtalo otra vez!";
        document.querySelector("#result-emoji").textContent = emoji;
        document.querySelector("#result-title").textContent = title;
        document.querySelector("#result-copy").textContent = copy;
        announcement.textContent = `Misión completada. ${score} de ${questions.length} respuestas correctas.`;
        document.querySelector("#result-title").focus();
      }

      nextButton.addEventListener("click", () => {
        if (current === questions.length - 1) {
          progressEl.style.width = "100%";
          progressTrack.setAttribute("aria-valuenow", String(questions.length));
          showResults();
          return;
        }
        current++;
        renderQuestion();
        questionTitle.focus();
      });

      document.querySelector("#restart").addEventListener("click", () => {
        current = 0;
        score = 0;
        scoreEl.textContent = "0";
        result.hidden = true;
        quiz.hidden = false;
        renderQuestion();
        questionTitle.focus();
      });

      renderQuestion();
    </script>
  </body>
</html>
